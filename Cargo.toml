[package]
name = "aura_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros", "rustls"] }
tokio = { version = "1.8", features = ["rt-multi-thread", "macros"] }
log = "0.4"
pretty_env_logger = "0.5"
governor = "0.6"
nonzero_ext = "0.3"
aura_api_client = { git = "https://github.com/in-aura-we-trade/aura_api_client.git" }
tonic = "0.14"
tokio-stream = "0.1"
prost = "0.13"
